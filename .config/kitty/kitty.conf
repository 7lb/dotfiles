font_family family="GohuFont 11 Nerd Font Mono"
bold_font family="GohuFont 11 Nerd Font Mono" style="Bold"
italic_font family="GohuFont 11 Nerd Font Mono" style="Italic"
bold_italic_font family="GohuFont 11 Nerd Font Mono" style="Bold Italic"

font_size 8.0
undercurl_style thin-sparse
text_composition_strategy 1.7 30

initial_window_height 80c
initial_window_width 175c
remember_window_size no
resize_in_steps yes

enable_audio_bell no
shell_integration no-cursor

# Kanawaga Paper Ink -----------------------------------------------------------
background #1F1F28
foreground #DCD7BA
selection_background #363646
selection_foreground #9e9b93
url_color #938AA9
cursor #c4b28a
cursor_text_color #1F1F28

# Tabs
active_tab_background #1F1F28
active_tab_foreground #c4b28a
inactive_tab_background #2A2A37
inactive_tab_foreground #9e9b93
tab_bar_background #2A2A37

# normal
color0 #393836
color1 #c4746e
color2 #699469
color3 #c4b28a
color4 #435965
color5 #a292a3
color6 #8ea49e
color7 #C8C093

# bright
color8  #aca9a4
color9  #cc928e
color10 #72a072
color11 #d4c196
color12 #698a9b
color13 #b4a7b5
color14 #96ada7
